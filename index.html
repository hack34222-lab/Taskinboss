<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCK PAPER SCISSORS: CHAOS ARENA</title>
<style>
:root{--bg:#090c20;--white:#f5f8ff;--cyan:#1eebff;--pink:#ff37aa;--purple:#914bff;--green:#46ff9b;--red:#ff4b5a;--gold:#ffd241;--muted:#91a0c3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 25%,#24145a 0,transparent 35%),radial-gradient(circle at 90% 75%,#004b59 0,transparent 35%),var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;padding:14px;overflow-x:hidden}
.game{width:min(900px,100%);position:relative;background-image:linear-gradient(#111a35 1px,transparent 1px),linear-gradient(90deg,#111a35 1px,transparent 1px);background-size:60px 60px;border-radius:20px;padding:18px 18px 14px;overflow:hidden}
header{text-align:center;position:relative}
h1{font-size:clamp(27px,5vw,38px);margin:0 0 8px;letter-spacing:2px;text-shadow:0 0 18px #fff7}
.subtitle{color:var(--cyan);font-size:14px;font-weight:bold;letter-spacing:2px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.reset{position:absolute;right:0;top:0;background:#1c2342;color:white;border:2px solid var(--pink);border-radius:10px;padding:9px 12px;font-weight:bold}
.panel{background:#111430eF;border:2px solid var(--purple);border-radius:16px;box-shadow:0 0 18px #914bff26}
.scoreboard{margin:22px 0 16px;padding:12px 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}
.score-label{font-size:14px;font-weight:bold}.you{color:var(--cyan)}.cpu{color:var(--red)}
.score{font-size:42px;font-weight:900;line-height:1.15}.vs{color:var(--pink);font-size:23px;font-weight:bold;padding:0 20px}
.stats{text-align:center;color:var(--muted);font-size:14px;font-weight:bold;line-height:1.9;margin-bottom:16px}
#streak{color:var(--gold)}
.duel{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:10px}
.weapon-card{min-width:0;min-height:165px;padding:16px 8px;text-align:center;border-radius:20px;background:#0f1937;border:2px solid var(--cyan);box-shadow:0 0 16px #1eebff20}
.weapon-card.cpu-card{border-color:var(--pink);background:#1e1230}
.card-label{font-size:13px;font-weight:bold;letter-spacing:1px}
.weapon-icon{font-size:64px;line-height:1.5;filter:drop-shadow(0 0 12px #ffffff24);min-height:92px}
.weapon-name{font-size:17px;font-weight:900}
.lightning{text-align:center;color:var(--purple);font-size:24px;font-weight:bold}
.result{text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,5vw,42px);font-weight:900;margin:8px 0;text-shadow:0 0 18px currentColor}
.choose-title{text-align:center;color:var(--muted);font-size:13px;font-weight:bold;letter-spacing:1px;margin-bottom:10px}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.move{border:2px solid var(--cyan);border-radius:15px;background:#1d274c;color:white;padding:13px 5px 10px;min-height:75px;font-weight:900;transition:transform .12s,background .12s,box-shadow .12s}
.move:active{transform:scale(.96)}.move:hover{background:#283663;box-shadow:0 0 16px #1eebff30}
.move:nth-child(2){border-color:var(--purple)}.move:nth-child(3){border-color:var(--pink)}
.move small{display:block;margin-top:7px;font-size:12px;letter-spacing:1px}
footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;margin-top:18px}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.shake{animation:shake .18s linear 2}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(4px,-2px)}50%{transform:translate(-4px,2px)}75%{transform:translate(2px,3px)}}
@media(max-width:520px){body{padding:6px}.game{padding:16px 10px 12px}.reset{position:static;display:block;margin:12px auto 0}.scoreboard{margin-top:14px;padding:10px}.vs{padding:0 9px}.score{font-size:36px}.duel{grid-template-columns:1fr 25px 1fr;gap:5px}.weapon-card{min-height:145px;padding:12px 4px}.weapon-icon{font-size:52px;min-height:75px}.weapon-name{font-size:14px}.card-label{font-size:10px}.moves{gap:7px}.move{font-size:12px;min-height:70px}.move small{font-size:10px}.stats{font-size:12px}}
</style>
</head>
<body>
<main class="game" id="game">
<div id="particles"></div>
<header>
<h1>CHAOS ARENA</h1>
<div class="subtitle">ROCK • PAPER • SCISSORS</div>
<button class="reset" id="reset">↻ RESET</button>
</header>
<section class="scoreboard panel">
<div><div class="score-label you">YOU</div><div class="score" id="playerScore">0</div></div>
<div class="vs">VS</div>
<div><div class="score-label cpu">CPU</div><div class="score" id="cpuScore">0</div></div>
</section>
<div class="stats"><div id="round">ROUND 1</div><div id="streak">WIN STREAK: 0 &nbsp; BEST: 0</div></div>
<section class="duel">
<div class="weapon-card">
<div class="card-label you">YOUR WEAPON</div>
<div class="weapon-icon" id="playerIcon">?</div>
<div class="weapon-name" id="playerName">READY?</div>
</div>
<div class="lightning">ϟ<br>VS<br>ϟ</div>
<div class="weapon-card cpu-card">
<div class="card-label" style="color:var(--pink)">CPU WEAPON</div>
<div class="weapon-icon" id="cpuIcon">?</div>
<div class="weapon-name" id="cpuName">WAITING...</div>
</div>
</section>
<div class="result" id="result" style="color:var(--cyan)">CHOOSE YOUR WEAPON!</div>
<div class="choose-title">CHOOSE YOUR MOVE</div>
<section class="moves">
<button class="move" data-choice="r">✊ ROCK <small>PRESS 1</small></button>
<button class="move" data-choice="p">✋ PAPER <small>PRESS 2</small></button>
<button class="move" data-choice="s">✌ SCISSORS <small>PRESS 3</small></button>
</section>
<footer>KEYS: 1 ROCK &nbsp; 2 PAPER &nbsp; 3 SCISSORS &nbsp; • &nbsp; R RESET</footer>
</main>
<script>
(() => {
const names={r:"ROCK",p:"PAPER",s:"SCISSORS"};
const icons={r:"✊",p:"✋",s:"✌️"};
const beats={r:"s",p:"r",s:"p"};
let playerScore=0,cpuScore=0,rounds=0,streak=0,best=0;
const $=id=>document.getElementById(id);
function tone(freq=440,duration=.09){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.frequency.value=freq;osc.type="sine";gain.gain.setValueAtTime(.08,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration);
    osc.onended=()=>ctx.close();
  }catch(e){}
}
function burst(color,count=26){
 const layer=$("particles"),game=$("game"),rect=game.getBoundingClientRect();
 const cx=rect.width/2,cy=rect.height*.56;
 for(let i=0;i<count;i++){
   const p=document.createElement("i");p.className="particle";p.style.left=cx+"px";p.style.top=cy+"px";p.style.background=color;p.style.boxShadow=`0 0 9px ${color}`;
   const a=Math.random()*Math.PI*2,d=35+Math.random()*130;
   p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");
   layer.appendChild(p);p.addEventListener("animationend",()=>p.remove(),{once:true});
 }
}
function update(){
 $("playerScore").textContent=playerScore;$("cpuScore").textContent=cpuScore;
 $("round").textContent="ROUND "+(rounds+1);
 $("streak").textContent=`WIN STREAK: ${streak}   BEST: ${best}`;
 $("streak").style.color=streak?"var(--gold)":"var(--muted)";
}
function play(choice){
 const cpu=["r","p","s"][Math.floor(Math.random()*3)];rounds++;
 $("playerIcon").textContent=icons[choice];$("cpuIcon").textContent=icons[cpu];
 $("playerName").textContent=names[choice];$("cpuName").textContent=names[cpu];
 const result=$("result");
 if(choice===cpu){result.textContent="DRAW!";result.style.color="var(--gold)";streak=0;burst("#ffd241",14);tone(360,.13)}
 else if(beats[choice]===cpu){result.textContent="YOU WIN!";result.style.color="var(--green)";playerScore++;streak++;best=Math.max(best,streak);burst("#46ff9b",32);tone(720,.13)}
 else{result.textContent="CPU WINS!";result.style.color="var(--red)";cpuScore++;streak=0;burst("#ff4b5a",25);$("game").classList.remove("shake");void $("game").offsetWidth;$("game").classList.add("shake");tone(190,.18)}
 update();
}
function reset(){
 playerScore=cpuScore=rounds=streak=best=0;
 $("playerIcon").textContent=$("cpuIcon").textContent="?";
 $("playerName").textContent="READY?";$("cpuName").textContent="WAITING...";
 $("result").textContent="CHOOSE YOUR WEAPON!";$("result").style.color="var(--cyan)";
 $("particles").replaceChildren();update();tone(520,.08);
}
document.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>play(b.dataset.choice)));
$("reset").addEventListener("click",reset);
document.addEventListener("keydown",e=>{
 if(e.key==="1")play("r");else if(e.key==="2")play("p");else if(e.key==="3")play("s");else if(e.key.toLowerCase()==="r")reset();
});
update();
})();
</script>
</body>
</html>
